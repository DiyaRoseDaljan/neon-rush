<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON RUSH - Arcade Racing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #0a0e27;
            color: #00ff88;
            overflow: hidden;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        canvas {
            flex: 1;
            display: block;
            background: linear-gradient(180deg, #0a0e27 0%, #1a1a3e 100%);
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88;
            font-size: 16px;
            z-index: 10;
        }

        #stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat {
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid #00ff88;
            padding: 10px;
            border-radius: 5px;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.7;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #00ffff;
        }

        #trackName {
            text-align: center;
            font-size: 24px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #ff00ff;
        }

        #raceInfo {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 14px;
        }

        #ui {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 10;
        }

        .controls {
            font-size: 14px;
            margin-top: 10px;
            opacity: 0.8;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 14, 39, 0.95);
            border: 3px solid #ff00ff;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            z-index: 100;
            display: none;
            box-shadow: 0 0 30px #ff00ff;
        }

        #gameOver h1 {
            font-size: 40px;
            color: #00ffff;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #00ffff;
        }

        #gameOver p {
            font-size: 18px;
            margin: 10px 0;
            color: #00ff88;
        }

        #gameOver button {
            margin-top: 20px;
            padding: 10px 30px;
            font-size: 16px;
            background: #00ff88;
            color: #0a0e27;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        #gameOver button:hover {
            background: #00ffff;
            box-shadow: 0 0 20px #00ffff;
        }

        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 14, 39, 0.95);
            border: 3px solid #00ff88;
            padding: 60px;
            border-radius: 10px;
            text-align: center;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 0 30px #00ff88;
        }

        #menu h1 {
            font-size: 48px;
            color: #ff00ff;
            text-shadow: 0 0 20px #ff00ff;
            margin-bottom: 30px;
        }

        #menu button {
            padding: 15px 40px;
            font-size: 18px;
            background: #00ff88;
            color: #0a0e27;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        #menu button:hover {
            background: #00ffff;
            box-shadow: 0 0 20px #00ffff;
            transform: scale(1.05);
        }

        #shopMenu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 14, 39, 0.95);
            border: 3px solid #ff00ff;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            z-index: 100;
            display: none;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 0 30px #ff00ff;
        }

        #shopMenu h1 {
            font-size: 36px;
            color: #00ffff;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #00ffff;
        }

        .shop-items {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 20px 0;
        }

        .shop-item {
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid #00ff88;
            padding: 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .shop-item:hover {
            background: rgba(0, 255, 136, 0.2);
            box-shadow: 0 0 15px #00ff88;
        }

        .shop-item h3 {
            color: #00ffff;
            margin-bottom: 10px;
        }

        .shop-item p {
            font-size: 12px;
            color: #00ff88;
            margin: 5px 0;
        }

        .shop-item .price {
            color: #ffff00;
            font-weight: bold;
            margin-top: 10px;
        }

        #shopMenu .back-btn {
            margin-top: 20px;
            padding: 10px 30px;
            background: #ff00ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        #nitroBar {
            position: absolute;
            bottom: 80px;
            left: 20px;
            width: 200px;
            height: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #ffff00;
            border-radius: 5px;
            overflow: hidden;
        }

        #nitroFill {
            height: 100%;
            background: linear-gradient(90deg, #ffff00, #ff6600);
            width: 0%;
            transition: width 0.1s;
        }

        @media (max-width: 768px) {
            #stats {
                grid-template-columns: repeat(2, 1fr);
            }
            #shopMenu .shop-items {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <div id="hud">
            <div id="trackName">🌃 NEON CITY</div>
            <div id="stats">
                <div class="stat">
                    <div class="stat-label">SPEED</div>
                    <div class="stat-value" id="speedDisplay">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">LAP</div>
                    <div class="stat-value" id="lapDisplay">1/3</div>
                </div>
                <div class="stat">
                    <div class="stat-label">COINS</div>
                    <div class="stat-value" id="coinsDisplay">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">POSITION</div>
                    <div class="stat-value" id="positionDisplay">1/4</div>
                </div>
            </div>
            <div id="raceInfo">
                <div>Best Lap: <span id="bestLap">--</span></div>
                <div>Current Lap: <span id="currentLap">--</span></div>
                <div>Car: <span id="carDisplay">Basic Racer</span></div>
            </div>
        </div>

        <div id="nitroBar">
            <div id="nitroFill"></div>
        </div>

        <div id="ui">
            <div class="controls">
                WASD/Arrows: Move | Space: Nitro | Shift: Drift | R: Restart
            </div>
        </div>

        <div id="menu">
            <h1>🏎️ NEON RUSH</h1>
            <button onclick="game.startRace()">START RACE</button>
            <button onclick="game.showShop()">SHOP</button>
            <button onclick="game.showStats()">STATS</button>
        </div>

        <div id="shopMenu">
            <h1>🛒 UPGRADE SHOP</h1>
            <div style="color: #00ff88; margin-bottom: 20px;">
                Balance: <span id="balance">0</span> 💰
            </div>
            <div id="shopContent"></div>
            <button class="back-btn" onclick="game.backToMenu()">BACK</button>
        </div>

        <div id="gameOver">
            <h1>RACE COMPLETE!</h1>
            <p>Position: <span id="finalPosition">1st</span></p>
            <p>Coins Earned: <span id="coinsEarned">0</span></p>
            <p>Best Lap: <span id="finalBestLap">--</span></p>
            <button onclick="game.backToMenu()">BACK TO MENU</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        const tracks = {
            neonCity: {
                name: '🌃 NEON CITY',
                waypoints: [
                    {x: 100, y: 300}, {x: 300, y: 200}, {x: 500, y: 150},
                    {x: 700, y: 200}, {x: 800, y: 400}, {x: 700, y: 600},
                    {x: 500, y: 650}, {x: 300, y: 600}, {x: 200, y: 500},
                    {x: 100, y: 300}
                ],
                color: '#ff00ff'
            },
            coastalHighway: {
                name: '🌴 COASTAL HIGHWAY',
                waypoints: [
                    {x: 100, y: 200}, {x: 300, y: 100}, {x: 500, y: 150},
                    {x: 700, y: 300}, {x: 800, y: 500}, {x: 700, y: 700},
                    {x: 500, y: 750}, {x: 300, y: 700}, {x: 100, y: 500},
                    {x: 100, y: 200}
                ],
                color: '#00ffff'
            },
            desertRun: {
                name: '🏜️ DESERT RUN',
                waypoints: [
                    {x: 150, y: 250}, {x: 400, y: 100}, {x: 650, y: 150},
                    {x: 750, y: 400}, {x: 700, y: 650}, {x: 400, y: 700},
                    {x: 150, y: 600}, {x: 100, y: 350}, {x: 150, y: 250}
                ],
                color: '#ffaa00'
            }
        };

        const cars = {
            basic: {
                name: 'Basic Racer',
                topSpeed: 8,
                acceleration: 0.3,
                handling: 0.05,
                nitro: 100,
                price: 0,
                color: '#00ff88',
                owned: true
            },
            sport: {
                name: 'Sport Coupe',
                topSpeed: 10,
                acceleration: 0.4,
                handling: 0.06,
                nitro: 120,
                price: 500,
                color: '#00ffff',
                owned: false
            },
            turbo: {
                name: 'Turbo Racer',
                topSpeed: 12,
                acceleration: 0.5,
                handling: 0.07,
                nitro: 150,
                price: 1500,
                color: '#ffff00',
                owned: false
            },
            lightning: {
                name: 'Lightning',
                topSpeed: 15,
                acceleration: 0.6,
                handling: 0.08,
                nitro: 200,
                price: 3000,
                color: '#ff00ff',
                owned: false
            }
        };

        const game = {
            state: 'menu',
            canvas: canvas,
            ctx: ctx,
            currentTrack: tracks.neonCity,
            currentCar: cars.basic,
            coins: 0,
            player: null,
            enemies: [],
            traffic: [],
            boosts: [],
            coins: 0,
            gameCoins: [],
            raceActive: false,
            lapCount: 0,
            bestLapTime: Infinity,
            currentLapTime: 0,
            lapStartTime: 0,
            raceStartTime: 0,
            checkpointIndex: 0,
            position: 1,

            init() {
                document.addEventListener('keydown', (e) => this.handleKeyDown(e));
                document.addEventListener('keyup', (e) => this.handleKeyUp(e));
                this.loadGameState();
                this.showMenu();
                this.animate();
            },

            loadGameState() {
                const saved = localStorage.getItem('neonRushState');
                if (saved) {
                    const state = JSON.parse(saved);
                    this.coins = state.coins || 0;
                    Object.keys(state.cars || {}).forEach(key => {
                        if (cars[key]) cars[key].owned = state.cars[key].owned;
                    });
                }
            },

            saveGameState() {
                const state = {
                    coins: this.coins,
                    cars: {}
                };
                Object.keys(cars).forEach(key => {
                    state.cars[key] = { owned: cars[key].owned };
                });
                localStorage.setItem('neonRushState', JSON.stringify(state));
            },

            showMenu() {
                this.state = 'menu';
                document.getElementById('menu').style.display = 'flex';
                document.getElementById('shopMenu').style.display = 'none';
                document.getElementById('gameOver').style.display = 'none';
            },

            showShop() {
                this.state = 'shop';
                document.getElementById('menu').style.display = 'none';
                document.getElementById('shopMenu').style.display = 'block';
                document.getElementById('balance').textContent = this.coins;

                const shopContent = document.getElementById('shopContent');
                shopContent.innerHTML = '';

                const carsHtml = Object.keys(cars).map(key => {
                    const car = cars[key];
                    const owned = car.owned ? '✓ OWNED' : `BUY`;
                    const buttonClass = car.owned ? 'owned' : 'buy';
                    return `
                        <div class="shop-item">
                            <h3>${car.name}</h3>
                            <p>⚡ Speed: ${car.topSpeed}</p>
                            <p>🚀 Accel: ${car.acceleration}</p>
                            <p>🛞 Handle: ${car.handling}</p>
                            <div class="price">${owned === '✓ OWNED' ? '✓ OWNED' : car.price + ' 💰'}</div>
                            ${!car.owned ? `<button onclick="game.buyCar('${key}')" style="background: #00ff88; color: #0a0e27; border: none; padding: 8px 15px; margin-top: 8px; cursor: pointer; border-radius: 3px; font-weight: bold;">BUY</button>` : ''}
                        </div>
                    `;
                }).join('');

                shopContent.innerHTML = carsHtml;
            },

            buyCar(carKey) {
                if (!cars[carKey]) return;
                const car = cars[carKey];
                if (this.coins >= car.price) {
                    this.coins -= car.price;
                    car.owned = true;
                    this.currentCar = car;
                    document.getElementById('carDisplay').textContent = car.name;
                    this.saveGameState();
                    this.showShop();
                } else {
                    alert('Not enough coins!');
                }
            },

            showStats() {
                alert(`Player Stats:\nTotal Coins: ${this.coins}\nCars Owned: ${Object.values(cars).filter(c => c.owned).length}/${Object.keys(cars).length}`);
            },

            backToMenu() {
                if (this.state === 'racing') {
                    this.raceActive = false;
                }
                this.showMenu();
            },

            startRace() {
                this.state = 'racing';
                this.raceActive = true;
                this.lapCount = 1;
                this.bestLapTime = Infinity;
                this.currentLapTime = 0;
                this.lapStartTime = performance.now();
                this.raceStartTime = performance.now();
                this.checkpointIndex = 0;
                this.position = 1;

                document.getElementById('menu').style.display = 'none';
                document.getElementById('shopMenu').style.display = 'none';
                document.getElementById('gameOver').style.display = 'none';

                // Initialize player
                const startPoint = this.currentTrack.waypoints[0];
                this.player = {
                    x: startPoint.x,
                    y: startPoint.y,
                    vx: 0,
                    vy: 0,
                    angle: 0,
                    speed: 0,
                    nitro: this.currentCar.nitro,
                    maxNitro: this.currentCar.nitro,
                    drifting: false,
                    driftPower: 0,
                    width: 30,
                    height: 20,
                    damage: 0,
                    coins: 0,
                    lastCheckpointIndex: 0,
                    lapStartDistance: 0
                };

                // Initialize enemies
                this.enemies = [];
                for (let i = 0; i < 3; i++) {
                    const offset = i + 1;
                    this.enemies.push({
                        x: startPoint.x + offset * 50,
                        y: startPoint.y,
                        vx: 0,
                        vy: 0,
                        angle: 0,
                        speed: 0,
                        checkpointIndex: 0,
                        width: 30,
                        height: 20,
                        laps: 0,
                        ai: { targetSpeed: 5, variation: Math.random() * 2 }
                    });
                }

                // Initialize traffic
                this.traffic = [];
                for (let i = 0; i < 5; i++) {
                    const waypoint = this.currentTrack.waypoints[Math.floor(Math.random() * this.currentTrack.waypoints.length)];
                    this.traffic.push({
                        x: waypoint.x + Math.random() * 200 - 100,
                        y: waypoint.y + Math.random() * 200 - 100,
                        vx: (Math.random() - 0.5) * 3,
                        vy: (Math.random() - 0.5) * 3,
                        width: 35,
                        height: 20,
                        angle: Math.random() * Math.PI * 2,
                        color: `hsl(${Math.random() * 360}, 100%, 50%)`
                    });
                }

                // Initialize coins
                this.gameCoins = [];
                for (let i = 0; i < 8; i++) {
                    const waypoint = this.currentTrack.waypoints[i % this.currentTrack.waypoints.length];
                    this.gameCoins.push({
                        x: waypoint.x + (Math.random() - 0.5) * 150,
                        y: waypoint.y + (Math.random() - 0.5) * 150,
                        collected: false,
                        value: 10
                    });
                }

                // Initialize boosts
                this.boosts = [];
                for (let i = 0; i < 4; i++) {
                    const waypoint = this.currentTrack.waypoints[Math.floor(Math.random() * this.currentTrack.waypoints.length)];
                    this.boosts.push({
                        x: waypoint.x,
                        y: waypoint.y,
                        active: true,
                        radius: 30
                    });
                }
            },

            handleKeyDown(e) {
                if (!this.player) return;
                switch(e.key.toLowerCase()) {
                    case 'w': case 'arrowup':
                        this.player.accelerating = true;
                        break;
                    case 's': case 'arrowdown':
                        this.player.braking = true;
                        break;
                    case 'a': case 'arrowleft':
                        this.player.turningLeft = true;
                        break;
                    case 'd': case 'arrowright':
                        this.player.turningRight = true;
                        break;
                    case ' ':
                        this.player.nitroActive = true;
                        e.preventDefault();
                        break;
                    case 'shift':
                        this.player.drifting = true;
                        this.player.driftPower = 0;
                        e.preventDefault();
                        break;
                    case 'r':
                        if (this.raceActive) this.startRace();
                        break;
                }
            },

            handleKeyUp(e) {
                if (!this.player) return;
                switch(e.key.toLowerCase()) {
                    case 'w': case 'arrowup':
                        this.player.accelerating = false;
                        break;
                    case 's': case 'arrowdown':
                        this.player.braking = false;
                        break;
                    case 'a': case 'arrowleft':
                        this.player.turningLeft = false;
                        break;
                    case 'd': case 'arrowright':
                        this.player.turningRight = false;
                        break;
                    case ' ':
                        this.player.nitroActive = false;
                        break;
                    case 'shift':
                        this.player.drifting = false;
                        break;
                }
            },

            updatePlayer() {
                if (!this.player) return;

                // Acceleration
                if (this.player.accelerating) {
                    this.player.speed = Math.min(this.player.speed + this.currentCar.acceleration, this.currentCar.topSpeed);
                } else if (this.player.braking) {
                    this.player.speed = Math.max(this.player.speed - 0.2, 0);
                } else {
                    this.player.speed *= 0.98;
                }

                // Nitro
                if (this.player.nitroActive && this.player.nitro > 0) {
                    this.player.speed = Math.min(this.player.speed + 0.2, this.currentCar.topSpeed * 1.3);
                    this.player.nitro -= 2;
                } else {
                    this.player.nitro = Math.min(this.player.nitro + 0.5, this.currentCar.nitro);
                }

                // Steering
                const steering = this.currentCar.handling;
                if (this.player.turningLeft) {
                    this.player.angle += steering;
                }
                if (this.player.turningRight) {
                    this.player.angle -= steering;
                }

                // Drift
                if (this.player.drifting && this.player.speed > 3) {
                    this.player.driftPower = Math.min(this.player.driftPower + 0.05, 1);
                    this.player.angle += (this.player.turningLeft ? 0.08 : this.player.turningRight ? -0.08 : 0);
                } else {
                    this.player.driftPower = 0;
                }

                // Velocity
                this.player.vx = Math.cos(this.player.angle) * this.player.speed;
                this.player.vy = Math.sin(this.player.angle) * this.player.speed;

                // Position
                this.player.x += this.player.vx;
                this.player.y += this.player.vy;

                // Track boundaries (wrap around)
                const bounds = 100;
                if (this.player.x < -bounds) this.player.x = canvas.width + bounds;
                if (this.player.x > canvas.width + bounds) this.player.x = -bounds;
                if (this.player.y < -bounds) this.player.y = canvas.height + bounds;
                if (this.player.y > canvas.height + bounds) this.player.y = -bounds;

                // Collision with traffic
                this.traffic.forEach(vehicle => {
                    const dx = vehicle.x - this.player.x;
                    const dy = vehicle.y - this.player.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < 40) {
                        this.player.speed *= 0.7;
                        this.player.damage += 10;
                        this.player.x -= dx * 0.1;
                        this.player.y -= dy * 0.1;
                    }
                });

                // Collect coins
                this.gameCoins.forEach(coin => {
                    const dx = coin.x - this.player.x;
                    const dy = coin.y - this.player.y;
                    if (Math.hypot(dx, dy) < 25) {
                        coin.collected = true;
                        this.player.coins += coin.value;
                    }
                });

                // Boost pads
                this.boosts.forEach(boost => {
                    const dx = boost.x - this.player.x;
                    const dy = boost.y - this.player.y;
                    if (Math.hypot(dx, dy) < boost.radius) {
                        this.player.speed = Math.min(this.player.speed + 3, this.currentCar.topSpeed * 1.3);
                        boost.active = false;
                    }
                });

                // Update HUD
                document.getElementById('speedDisplay').textContent = Math.floor(this.player.speed);
                document.getElementById('coinsDisplay').textContent = this.player.coins;
                document.getElementById('nitroFill').style.width = (this.player.nitro / this.player.maxNitro) * 100 + '%';

                // Checkpoint detection
                this.checkpointIndex = this.getClosestCheckpoint(this.player);
                if (this.checkpointIndex === 0 && this.player.lastCheckpointIndex > this.currentTrack.waypoints.length - 2) {
                    // Lap complete
                    const lapTime = performance.now() - this.lapStartTime;
                    if (lapTime < this.bestLapTime) {
                        this.bestLapTime = lapTime;
                    }
                    this.lapCount++;
                    this.lapStartTime = performance.now();

                    if (this.lapCount > 3) {
                        this.endRace();
                    }
                }
                this.player.lastCheckpointIndex = this.checkpointIndex;

                document.getElementById('lapDisplay').textContent = `${this.lapCount}/3`;
            },

            updateEnemies() {
                this.enemies.forEach(enemy => {
                    // Simple AI
                    const targetWaypoint = this.currentTrack.waypoints[enemy.checkpointIndex];
                    const dx = targetWaypoint.x - enemy.x;
                    const dy = targetWaypoint.y - enemy.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < 50) {
                        enemy.checkpointIndex = (enemy.checkpointIndex + 1) % this.currentTrack.waypoints.length;
                    }

                    const targetAngle = Math.atan2(dy, dx);
                    const angleDiff = targetAngle - enemy.angle;
                    enemy.angle += Math.sign(angleDiff) * Math.min(Math.abs(angleDiff), 0.1);

                    enemy.speed = Math.min(enemy.speed + 0.1, enemy.ai.targetSpeed + (Math.random() - 0.5) * enemy.ai.variation);

                    enemy.vx = Math.cos(enemy.angle) * enemy.speed;
                    enemy.vy = Math.sin(enemy.angle) * enemy.speed;

                    enemy.x += enemy.vx;
                    enemy.y += enemy.vy;

                    // Track boundaries
                    const bounds = 100;
                    if (enemy.x < -bounds) enemy.x = canvas.width + bounds;
                    if (enemy.x > canvas.width + bounds) enemy.x = -bounds;
                    if (enemy.y < -bounds) enemy.y = canvas.height + bounds;
                    if (enemy.y > canvas.height + bounds) enemy.y = -bounds;

                    // Lap counting
                    if (enemy.checkpointIndex === 0 && this.getClosestCheckpoint(enemy) > this.currentTrack.waypoints.length - 2) {
                        enemy.laps++;
                    }
                });

                // Update position
                const racers = [{ laps: this.lapCount, checkpoint: this.checkpointIndex }, ...this.enemies.map(e => ({ laps: e.laps, checkpoint: e.checkpointIndex }))];
                racers.sort((a, b) => {
                    if (b.laps !== a.laps) return b.laps - a.laps;
                    return b.checkpoint - a.checkpoint;
                });
                this.position = racers.findIndex(r => r === racers[0]) + 1;
                document.getElementById('positionDisplay').textContent = `${this.position}/4`;
            },

            updateTraffic() {
                this.traffic.forEach(vehicle => {
                    vehicle.x += vehicle.vx;
                    vehicle.y += vehicle.vy;

                    if (vehicle.x < -50) vehicle.x = canvas.width + 50;
                    if (vehicle.x > canvas.width + 50) vehicle.x = -50;
                    if (vehicle.y < -50) vehicle.y = canvas.height + 50;
                    if (vehicle.y > canvas.height + 50) vehicle.y = -50;

                    if (Math.random() < 0.01) {
                        vehicle.vx = (Math.random() - 0.5) * 3;
                        vehicle.vy = (Math.random() - 0.5) * 3;
                    }
                });
            },

            getClosestCheckpoint(obj) {
                let closest = 0;
                let minDist = Infinity;
                this.currentTrack.waypoints.forEach((wp, i) => {
                    const dist = Math.hypot(wp.x - obj.x, wp.y - obj.y);
                    if (dist < minDist) {
                        minDist = dist;
                        closest = i;
                    }
                });
                return closest;
            },

            endRace() {
                this.raceActive = false;
                this.coins += this.player.coins;
                this.saveGameState();

                document.getElementById('finalPosition').textContent = this.position === 1 ? '🥇 1st' : this.position === 2 ? '🥈 2nd' : '🥉 3rd';
                document.getElementById('coinsEarned').textContent = this.player.coins;
                document.getElementById('finalBestLap').textContent = (this.bestLapTime / 1000).toFixed(2) + 's';

                document.getElementById('gameOver').style.display = 'block';
            },

            drawTrack() {
                ctx.strokeStyle = this.currentTrack.color;
                ctx.lineWidth = 100;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                ctx.beginPath();
                ctx.moveTo(this.currentTrack.waypoints[0].x, this.currentTrack.waypoints[0].y);
                this.currentTrack.waypoints.forEach((wp, i) => {
                    if (i > 0) ctx.lineTo(wp.x, wp.y);
                });
                ctx.closePath();
                ctx.stroke();

                // Draw checkpoints
                ctx.fillStyle = 'rgba(255, 255, 0, 0.3)';
                this.currentTrack.waypoints.forEach((wp, i) => {
                    ctx.beginPath();
                    ctx.arc(wp.x, wp.y, 40, 0, Math.PI * 2);
                    ctx.fill();
                });
            },

            drawVehicle(vehicle, color = '#00ff88') {
                ctx.save();
                ctx.translate(vehicle.x, vehicle.y);
                ctx.rotate(vehicle.angle + Math.PI / 2);

                // Body
                ctx.fillStyle = color;
                ctx.fillRect(-vehicle.width / 2, -vehicle.height / 2, vehicle.width, vehicle.height);

                // Windshield
                ctx.fillStyle = '#00ffff';
                ctx.fillRect(-vehicle.width / 2 + 2, -vehicle.height / 2 + 2, vehicle.width - 4, 8);

                ctx.restore();
            },

            drawPlayer() {
                const glow = this.player.driftPower * 10;
                ctx.shadowColor = this.currentCar.color;
                ctx.shadowBlur = glow;
                this.drawVehicle(this.player, this.currentCar.color);
                ctx.shadowBlur = 0;

                // Nitro indicator
                if (this.player.nitroActive) {
                    ctx.fillStyle = 'rgba(255, 255, 0, 0.5)';
                    ctx.beginPath();
                    ctx.arc(this.player.x, this.player.y, 40, 0, Math.PI * 2);
                    ctx.fill();
                }
            },

            drawCoins() {
                this.gameCoins.forEach(coin => {
                    if (!coin.collected) {
                        ctx.fillStyle = '#ffff00';
                        ctx.beginPath();
                        ctx.arc(coin.x, coin.y, 8, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.strokeStyle = '#ffaa00';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                });
            },

            drawBoosts() {
                this.boosts.forEach(boost => {
                    if (boost.active) {
                        ctx.fillStyle = 'rgba(255, 0, 255, 0.3)';
                        ctx.beginPath();
                        ctx.arc(boost.x, boost.y, boost.radius, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.strokeStyle = '#ff00ff';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                });
            },

            update() {
                if (this.state === 'racing' && this.raceActive) {
                    this.updatePlayer();
                    this.updateEnemies();
                    this.updateTraffic();
                }
            },

            draw() {
                ctx.fillStyle = 'rgba(10, 14, 39, 0.5)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (this.state === 'racing' && this.player) {
                    this.drawTrack();
                    this.drawBoosts();
                    this.drawCoins();

                    // Draw enemies
                    this.enemies.forEach(enemy => {
                        this.drawVehicle(enemy, '#ff0088');
                    });

                    // Draw traffic
                    this.traffic.forEach(vehicle => {
                        this.drawVehicle(vehicle, vehicle.color);
                    });

                    this.drawPlayer();

                    // Mini speedlines for high speed
                    if (this.player.speed > 8) {
                        ctx.strokeStyle = `rgba(0, 255, 136, ${this.player.speed / 15})`;
                        ctx.lineWidth = 2;
                        for (let i = 0; i < 5; i++) {
                            const offset = (performance.now() / 10 + i * 20) % 100;
                            ctx.beginPath();
                            ctx.moveTo(this.player.x, this.player.y + offset - 50);
                            ctx.lineTo(this.player.x, this.player.y + offset + 50);
                            ctx.stroke();
                        }
                    }
                }
            },

            animate() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.animate());
            }
        };

        game.init();
    </script>
</body>
</html>
